apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-account-service
  namespace: banking
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: user-account-service
  template:
    metadata:
      labels:
        app: user-account-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka-broker 9092; do echo waiting for kafka-broker; sleep 2; done"]
      containers:
        - name: user-account-service
          image: user-account-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_db?currentSchema=user_schema
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka-broker:9092
            - name: SPRING_JPA_OPEN_IN_VIEW
              value: "false"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: ""
            # Cap heap so two JVMs + Kafka + PG fit in the minikube VM on an 8 GB Mac
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=65 -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/urandom"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "700Mi"
              # no CPU limit on purpose: let the JVM grab spare cycles to boot,
              # then fall back to ~200m at idle. A hard limit here = 17-min startups.
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health
              port: 8080
            initialDelaySeconds: 150
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health
              port: 8080
            initialDelaySeconds: 160
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: user-account-service
  namespace: banking
spec:
  type: NodePort
  selector:
    app: user-account-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
